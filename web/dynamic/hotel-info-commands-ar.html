<!-- Get Token -->
<basis core="api" name="api.token" url="https://admin.basiscore.net/apitoken" method="post"
    content-type="application/json" run="atclient" if="{##cms.token##}" triggers="cms.token" body='{
        "dmnid": "[##cms.cms.domainid##]",
        "lid": "3"
    }'>
</basis>
<basis core="callback" triggers="api.token" run="atclient" method="setToken"></basis>
<!-- Get Gallery -->
<basis core="api" name="api.gallery"
    url="https://data.basiscore.net/{##cms.data.lang##}/bc/{##cms.data.name##}/id/gallery/json" method="post"
    content-type="application/json" run="atclient" if="{##cms.data##}" triggers="cms.data" body='{
        "token": "{##cms.data.token##}",
        "usedforid":[{##cms.data.usedforids##}],
        "wordid": "94604",
        "lid": "3"
        }' onprocessed="onProcessedapiGallery">
</basis>
<!-- Get Info -->
<basis core="api" name="api.info"
    url="https://data.basiscore.net/{##cms.data.lang##}/bc/{##cms.data.name##}/id/inf/json" method="post"
    content-type="application/json" run="atclient" if="{##cms.data##}" triggers="cms.data" body='{
        "token": "{##cms.data.token##}",
        "usedforids":[{##cms.data.usedforids##}],
        "mode": "3",
        "lid": "3"
      
        }'>
</basis>
<basis core="callback" triggers="api.info" run="atclient" method="setInfo"></basis>
